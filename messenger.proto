}

// ======= OWL AI Assistant =======

message CreateOwlChatRequest {
  string user_id = 1;
  string name = 2;
}

message CreateOwlChatResponse {
  string chat_id = 1;
  string name = 4;
  bool success = 2;
  string message = 3;
}

message DeleteOwlChatRequest {
  string chat_id = 1;
  string user_id = 2;
}

message DeleteOwlChatResponse {
