  string sender_id = 3;

  oneof content {
    string text = 10;
    MessageMedia media = 11;
  }

  MessageReply reply = 12;

  bool edited = 20;
  bool is_read = 21;
  google.protobuf.Timestamp created_at = 22;
  bytes reactions = 23;

  bool is_e2ee = 30;
