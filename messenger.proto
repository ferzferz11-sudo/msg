message RateAIAgentResponse {
  bool success = 1;
  string error = 2;
  float avg_rating = 3;
  int32 review_count = 4;
}

message GetAIAgentReviewsRequest {
  string agent_id = 1;
  int32 limit = 2;
}

message AgentReviewInfo {
  string user_id = 1;
  int32 rating = 2;
  string review = 3;
  string created_at = 4;
}

message GetAIAgentReviewsResponse {
  repeated AgentReviewInfo reviews = 1;
  float avg_rating = 2;
  int32 review_count = 3;
}

message ListMarketplaceAgentsRequest {
  string query = 1;           // search by name/description/tags
  int32 limit = 2;
  int32 offset = 3;
}

message ListMarketplaceAgentsResponse {
  repeated AgentInfoV2 agents = 1;
  int32 total = 2;
}

message GetAIAgentStatsRequest {
  string agent_id = 1;
}

message GetAIAgentStatsResponse {
  int32 install_count = 1;
  float avg_rating = 2;
  int32 review_count = 3;
  int32 total_tokens_used = 4;
}

message ShareAIAgentRequest {
  string agent_id = 1;
}

message ShareAIAgentResponse {
  bool success = 1;
  string share_code = 2;
  string error = 3;
}

message InstallAIAgentRequest {
  string share_code = 1;
  string new_name = 2;        // optional rename
}

message InstallAIAgentResponse {
  bool success = 1;
  string agent_id = 2;
  string error = 3;
}

message GetAIUsageStatsRequest {}

message UsageStatInfo {
  string agent_id = 1;
  int32 total_tokens = 2;
  int32 request_count = 3;
  string period_start = 4;
  string agent_name = 5;
}

message GetAIUsageStatsResponse {
  repeated UsageStatInfo stats = 1;
  int32 total_tokens = 2;
  int32 total_requests = 3;
}

// ======= AI Chat v2 Messages =======

message GetAIV2ChatHistoryRequest {
  string session_id = 1;
  int32 limit = 2;
}

message AIV2ChatMessage {
  int64 id = 1;
  string chat_id = 2;
  string role = 3;
  string content = 4;
  string agent_id = 5;
  int32 token_count = 6;
  string model_used = 7;
  string created_at = 8;
}

message GetAIV2ChatHistoryResponse {
  repeated AIV2ChatMessage messages = 1;
}

message ListAIV2ChatsRequest {}

message AIV2ChatInfo {
  string id = 1;
  string name = 2;
  string chat_type = 3;
  string agent_id = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ListAIV2ChatsResponse {
  repeated AIV2ChatInfo chats = 1;
}

// ======= Admin User List Messages =======

message AdminUserInfo {
  // Base info
  string user_id = 1;
  string username = 2;
  string avatar_url = 3;
  string full_avatar_url = 4;
  string email = 5;
  bool is_super_admin = 6;

  // Version & activity
  string last_client_version = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  bool is_online = 9;

  // Last message
  string last_message_text = 10;
  google.protobuf.Timestamp last_message_time = 11;
  string last_message_username = 12;

  // Stats
  int32 chat_count = 13;
}

message GetAdminUserListRequest {
  string query = 1;
  string cursor = 2;
  int32 limit = 3;
  string sort_by = 4;
}

message GetAdminUserListResponse {
  repeated AdminUserInfo users = 1;
  string next_cursor = 2;
  bool has_more = 3;
  google.protobuf.Timestamp server_time = 4;
}

// ======= Admin User Sessions Messages =======

message AdminUserSession {
  string device_id = 1;
  string device_name = 2;
  string device_type = 3;
  string client_version = 4;
  string ip_address = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  bool is_online = 7;
}

message GetAdminUserSessionsRequest {
  string user_id = 1;
}

message GetAdminUserSessionsResponse {
  repeated AdminUserSession sessions = 1;
}

service ProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileV2Request) returns (UpdateProfileV2Response);
  rpc UpdateAvatar(UpdateAvatarV2Request) returns (UpdateAvatarV2Response);
  rpc DeleteProfile(DeleteProfileV2Request) returns (DeleteProfileV2Response);
  rpc GetUserSettings(GetUserSettingsRequest) returns (GetUserSettingsResponse);
  rpc UpdateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse);
}

// ======= Company System =======

service CompanyService {
  rpc CreateCompany(CreateCompanyRequest) returns (CreateCompanyResponse);
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  rpc UpdateCompany(UpdateCompanyRequest) returns (UpdateCompanyResponse);
  rpc DeleteCompany(DeleteCompanyRequest) returns (DeleteCompanyResponse);
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);

  rpc CreatePosition(CreatePositionRequest) returns (CreatePositionResponse);
  rpc UpdatePosition(UpdatePositionRequest) returns (UpdatePositionResponse);
  rpc DeletePosition(DeletePositionRequest) returns (DeletePositionResponse);
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);

  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc UpdateMemberPosition(UpdateMemberPositionRequest) returns (UpdateMemberPositionResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  rpc CreateCompanyChat(CreateCompanyChatRequest) returns (CreateCompanyChatResponse);
  rpc SetCompanyChatAccess(SetCompanyChatAccessRequest) returns (SetCompanyChatAccessResponse);
  rpc GetCompanyChats(GetCompanyChatsRequest) returns (GetCompanyChatsResponse);
  rpc JoinCompany(JoinCompanyRequest) returns (JoinCompanyResponse);
  rpc LeaveCompany(LeaveCompanyRequest) returns (LeaveCompanyResponse);
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  rpc GetCompanyByUser(GetCompanyByUserRequest) returns (GetCompanyByUserResponse);
  rpc SetPrimaryCompany(SetPrimaryCompanyRequest) returns (SetPrimaryCompanyResponse);
  rpc GetUserCompanies(GetUserCompaniesRequest) returns (GetUserCompaniesResponse);
}

message Company {
  string id = 1;
  string name = 2;
  string owner_id = 3;
  string avatar_url = 4;
  string created_at = 5;
  int32 member_count = 6;
}

message CompanyPosition {
  string id = 1;
  string company_id = 2;
  string title = 3;
  int32 level = 4;
  string chat_access = 5;
}

message CompanyMember {
  string id = 1;
  string company_id = 2;
  string user_id = 3;
  string username = 4;
  string avatar_url = 5;
  CompanyPosition position = 6;
  string joined_at = 7;
}

message CompanyChatInfo {
  string chat_id = 1;
  string company_id = 2;
  string access_level = 3;
  int32 min_position_level = 4;
}

message CreateCompanyRequest {
  string name = 1;
}
message CreateCompanyResponse {
  bool success = 1;
  Company company = 2;
}

message GetCompanyRequest {
  string company_id = 1;
}
message GetCompanyResponse {
  Company company = 1;
  repeated CompanyPosition positions = 2;
  int32 member_count = 3;
}

message UpdateCompanyRequest {
  string company_id = 1;
  string name = 2;
  string avatar_url = 3;
}
message UpdateCompanyResponse {
  bool success = 1;
  Company company = 2;
}

message DeleteCompanyRequest {
  string company_id = 1;
}
message DeleteCompanyResponse {
  bool success = 1;
  string message = 2;
}

message ListCompaniesRequest {
  string user_id = 1;
}
message ListCompaniesResponse {
  repeated Company companies = 1;
}

message CreatePositionRequest {
