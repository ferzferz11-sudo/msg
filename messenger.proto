enum TunnelMode {
  TUNNEL_NONE = 0;       // прямое подключение (без туннеля)
  TUNNEL_SSH = 1;        // SSH туннель: агент подключается к localhost:<port>
}

message DeployAgentTaskRequest {
  string agent_id = 1;
  string task_type = 2;
  map<string, string> params = 3;
  string working_dir = 4;
  int32 timeout_sec = 5;
  TunnelMode tunnel_mode = 6;      // режим туннеля (по умолчанию NONE)
  string tunnel_host = 7;          // SSH хост туннеля (напр. 13.140.25.249)
  int32 tunnel_port = 8;           // SSH порт (по умолчанию 22)
  string tunnel_user = 9;          // SSH пользователь
  string tunnel_password = 10;     // SSH пароль
  string tunnel_server_host = 11;  // хост сервера за туннелем (по умолчанию localhost)
  int32 tunnel_server_port = 12;   // порт сервера за туннелем
  int32 tunnel_local_port = 13;    // локальный порт для проброса
}

message DeployAgentTaskResponse {
  bool success = 1;
  string task_id = 2;
  string error = 3;
  string stdout = 4;
  string stderr = 5;
  int32 exit_code = 6;
  int64 duration_ms = 7;
}

message DeployAgentTaskStreamResponse {
  string task_id = 1;
  string stdout_chunk = 2;       // промежуточный stdout (по строкам или чанкам)
  string stderr_chunk = 3;       // промежуточный stderr
  string progress = 4;           // progress message (шаги, проценты)
  string status = 5;             // "running", "completed", "failed", "timeout"
  string stdout = 6;             // полный stdout (при done=true)
  string stderr = 7;             // полный stderr (при done=true)
  int32 exit_code = 8;           // финальный exit code
  int64 duration_ms = 9;         // финальная длительность
  string error = 10;             // финальная ошибка
  bool done = 11;                // true = последний чанк, задача завершена
}

message GetRemoteAgentStatusRequest {
  string agent_id = 1;
}

message GetRemoteAgentStatusResponse {
  string status = 1;
  int32 active_tasks = 2;
  string last_heartbeat = 3;
}

