// ======= Auth Service =======

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string avatar_url = 4;
  string bio = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_seen_at = 8;
}

message SignInRequest {
  string username = 1;
  string password = 2;
}

message SignUpRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message AuthResponse {
  bool success = 1;
  string token = 2;
  string message = 3;
  User user = 4;
}

service AuthService {
  rpc SignIn(SignInRequest) returns (AuthResponse);
  rpc SignUp(SignUpRequest) returns (AuthResponse);

  // V2 — JWT-based authentication with device management
  rpc SignInV2(SignInRequestV2) returns (AuthResponseV2);
  rpc SignUpV2(SignUpRequestV2) returns (AuthResponseV2);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc SignOut(SignOutRequest) returns (AuthResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (AuthResponse);
  // GetDevices is already in ChatService — reused via interceptor context
}

// ======= Auth V2 Messages =======

message SignInRequestV2 {
  string username = 1;
  string password = 2;
  DeviceInfo device = 3;
  string client_version = 4;
}

message SignUpRequestV2 {
  string username = 1;
  string password = 2;
  string email = 3;
  DeviceInfo device = 4;
  string client_version = 5;
}

message AuthResponseV2 {
  bool success = 1;
  string message = 2;
  string access_token = 3;
  string refresh_token = 4;
  int64 access_expires_at = 5;
  int64 refresh_expires_at = 6;
  User user = 7;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3;
  int64 refresh_expires_at = 4;
}

message SignOutRequest {
  string refresh_token = 1;
  bool all_devices = 2;
}

message RevokeDeviceRequest {
  string device_id = 1;
}

// ======= Profile Service V2 =======
// Separate service for profile management with JWT Bearer auth.
// All methods require valid JWT access token (injected by AuthInterceptor).
// Dev server: v2 (JWT). Prod server: v1 (legacy via ChatService).

message GetProfileRequest {
  // empty — user_id extracted from JWT context
}

message GetProfileResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string avatar_url = 4;
  string full_avatar_url = 5;
  string bio = 6;
  string status = 7;
  string locale = 8;          // "en", "ru", etc.
  bool is_super_admin = 9;
  string created_at = 10;
  string last_seen_at = 11;
}

message UpdateProfileV2Request {
  string username = 1;        // optional: change username
  string bio = 2;
  string status = 3;
  string locale = 4;          // "en", "ru"
}

message UpdateProfileV2Response {
  bool success = 1;
  string message = 2;
  GetProfileResponse profile = 3;
}

message UpdateAvatarV2Request {
  string avatar_url = 1;
  string full_avatar_url = 2;
}

message UpdateAvatarV2Response {
  bool success = 1;
  string message = 2;
  string avatar_url = 3;
  string full_avatar_url = 4;
}

message DeleteProfileV2Request {
  string password = 1;        // confirm deletion
}

message DeleteProfileV2Response {
  bool success = 1;
  string message = 2;
}

message GetUserSettingsRequest {
  // empty — user_id from JWT
}

message GetUserSettingsResponse {
  string locale = 1;
  string theme_id = 2;
  bool push_enabled = 3;
  map<string, string> custom = 4;  // extensible key-value
}

message UpdateUserSettingsRequest {
  string locale = 1;
  string theme_id = 2;
  bool push_enabled = 3;
  map<string, string> custom = 4;
}

message UpdateUserSettingsResponse {
  bool success = 1;
  string message = 2;
}

service ProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileV2Request) returns (UpdateProfileV2Response);
  rpc UpdateAvatar(UpdateAvatarV2Request) returns (UpdateAvatarV2Response);
  rpc DeleteProfile(DeleteProfileV2Request) returns (DeleteProfileV2Response);
  rpc GetUserSettings(GetUserSettingsRequest) returns (GetUserSettingsResponse);
  rpc UpdateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse);
}

