}

message UpdateChatNameResponse {
  bool success = 1;
  string message = 2;
}

message UpdateChatAvatarRequest {
  string chat_id = 1;
  string avatar_url = 2;
  string username = 3; // For admin verification
  string full_avatar_url = 4;
  string user_id = 5;
}

message UpdateChatAvatarResponse {
  bool success = 1;
  string message = 2;
}

message UpdateChatSettingsRequest {
  string chat_id = 1;
  bool allow_members_to_add = 2;
  string user_id = 3;
}

message UpdateChatSettingsResponse {
  bool success = 1;
  string message = 2;
}

message GetFCMLogsRequest {}

message FCMLogEntry {
  string timestamp = 1;
  string level = 2;
  string message = 3;
}

message GetFCMLogsResponse {
  repeated FCMLogEntry logs = 1;
}

message SaveDraftRequest {
  string user_id = 1;
  string room_id = 2;
  string draft_text = 3;
  string replied_to_message_id = 4;
  string replied_to_user = 5;
  string replied_to_text = 6;
}

message SaveDraftResponse {
  bool success = 1;
  string message = 2;
}

message GetDraftRequest {
  string user_id = 1;
  string room_id = 2;
}

message GetDraftResponse {
  string draft_text = 1;
  string replied_to_message_id = 2;
  string replied_to_user = 3;
  string replied_to_text = 4;
  bool has_draft = 5;
}

message DeleteDraftRequest {
  string user_id = 1;
  string room_id = 2;
}

message DeleteDraftResponse {
  bool success = 1;
}

message GetMutedChatsRequest {
  string user_id = 1;
}

message GetMutedChatsResponse {
  repeated string room_ids = 1;
}

message SetMutedChatRequest {
  string user_id = 1;
  string room_id = 2;
  bool muted = 3;
}

message SetMutedChatResponse {
  bool success = 1;
}

message GetUserIdRequest {
  string username = 1;
}

message GetUserIdResponse {
  string user_id = 1;
  bool found = 2;
}

message AddFavoriteRequest {
  string user_id = 1;
  string message_id = 2;
}

message AddFavoriteResponse {
  bool success = 1;
  string message = 2;
}

message RemoveFavoriteRequest {
  string user_id = 1;
  string message_id = 2;
}

message RemoveFavoriteResponse {
  bool success = 1;
}

message GetFavoritesRequest {
  string user_id = 1;
}

message GetFavoritesResponse {
  repeated Message messages = 1;
}

message TypingRequest {
  string room_id = 1;
  string username = 2;
  bool is_typing = 3;
  string user_id = 4;
}

message TypingSignal {
  string room_id = 1;
  string username = 2;
  bool is_typing = 3;
}

message DeviceInfo {
  string device_id = 1;
  string device_name = 2;
  string client_version = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  string ip_address = 5;
}

message GetDevicesRequest {
  string user_id = 1;
}

message GetDevicesResponse {
  repeated DeviceInfo devices = 1;
}

message DeleteDeviceRequest {
  string user_id = 1;
  string device_id = 2;
}

message DeleteDeviceResponse {
  bool success = 1;
  string message = 2;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  bool success = 1;
  string message = 2;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}

message CallMessage {
  string call_id = 1;
  string sender_id = 2;
  string receiver_id = 3;
  string sender_name = 6;
  string receiver_name = 7;
  string room_id = 8;

  enum Type {
    INITIATE = 0;    // Абонент А звонит Абоненту Б
    ACCEPT = 1;      // Абонент Б принял вызов
    REJECT = 2;      // Абонент Б отклонил вызов
    HANGUP = 3;      // Завершение звонка
    OFFER = 4;       // WebRTC SDP Offer
    ANSWER = 5;      // WebRTC SDP Answer
    ICE_CANDIDATE = 6; // WebRTC ICE Candidate

    // Group Conference
    INITIATE_CONFERENCE = 10;
    JOIN_CONFERENCE = 11;
    LEAVE_CONFERENCE = 12;
    END_CONFERENCE = 13;
    INVITE_TO_CONFERENCE = 14;
    REMOVE_FROM_CONFERENCE = 15;
    UPDATE_CONFERENCE = 16;
  }
  Type type = 4;

  string payload = 5; // JSON-строка с SDP или ICE данными
}

service ChatService {
  rpc Chat(stream Message) returns (stream Message);
  rpc Typing(stream TypingRequest) returns (stream TypingSignal);
  rpc CallSession (stream CallMessage) returns (stream CallMessage);
  rpc GetClients(ClientListRequest) returns (ClientListResponse);
  rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse);
  rpc GetAllChats(GetAllChatsRequest) returns (GetAllChatsResponse);
  // DEPRECATED: use GetHistoryV2 instead
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  // DEPRECATED: use SetReactionV2 instead
  rpc SetReaction(ReactionRequest) returns (ReactionResponse);
  // DEPRECATED: use DeleteMessageV2 instead
  rpc DeleteMessages(DeleteMessagesRequest) returns (DeleteMessagesResponse);
  rpc RegisterToken(TokenRequest) returns (TokenResponse);
  rpc GetChats(GetChatsRequest) returns (GetChatsResponse);
  rpc GetChatsV2(GetChatsRequest) returns (GetChatsResponse);
  rpc GetChatListVersion(GetChatListVersionRequest) returns (GetChatListVersionResponse);
  rpc CreateDirectChat(CreateDirectChatRequest) returns (CreateDirectChatResponse);
  rpc CreateGroupChat(CreateGroupChatRequest) returns (CreateGroupChatResponse);
  rpc UpdateUsername(UpdateUsernameRequest) returns (UpdateUsernameResponse);
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
  rpc AdminUpdatePassword(AdminUpdatePasswordRequest) returns (AdminUpdatePasswordResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc UpdateAvatar(UpdateAvatarRequest) returns (UpdateAvatarResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc GetUserAvatar(GetUserAvatarRequest) returns (GetUserAvatarResponse);
  rpc AddParticipant(AddParticipantRequest) returns (AddParticipantResponse);
  rpc RemoveParticipant(RemoveParticipantRequest) returns (RemoveParticipantResponse);
  // DEPRECATED: use EditMessageV2 instead
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  rpc UpdateChatName(UpdateChatNameRequest) returns (UpdateChatNameResponse);
  rpc UpdateChatAvatar(UpdateChatAvatarRequest) returns (UpdateChatAvatarResponse);
  rpc UpdateChatSettings(UpdateChatSettingsRequest) returns (UpdateChatSettingsResponse);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
  rpc AddContact(AddContactRequest) returns (AddContactResponse);
  rpc RemoveContact(RemoveContactRequest) returns (RemoveContactResponse);
  rpc GetContacts(GetContactsRequest) returns (GetContactsResponse);
  rpc GetThemes(GetThemesRequest) returns (GetThemesResponse);
  rpc SaveTheme(SaveThemeRequest) returns (SaveThemeResponse);
  rpc SetCurrentTheme(SetCurrentThemeRequest) returns (SetCurrentThemeResponse);
  rpc DeleteTheme(DeleteThemeRequest) returns (DeleteThemeResponse);
  rpc GetFCMLogs(GetFCMLogsRequest) returns (GetFCMLogsResponse);
  rpc SaveDraft(SaveDraftRequest) returns (SaveDraftResponse);
  rpc GetDraft(GetDraftRequest) returns (GetDraftResponse);
  rpc DeleteDraft(DeleteDraftRequest) returns (DeleteDraftResponse);
  rpc GetMutedChats(GetMutedChatsRequest) returns (GetMutedChatsResponse);
  rpc SetMutedChat(SetMutedChatRequest) returns (SetMutedChatResponse);
  rpc GetUserId(GetUserIdRequest) returns (GetUserIdResponse);
  rpc AddFavorite(AddFavoriteRequest) returns (AddFavoriteResponse);
  rpc RemoveFavorite(RemoveFavoriteRequest) returns (RemoveFavoriteResponse);
  rpc GetFavorites(GetFavoritesRequest) returns (GetFavoritesResponse);
  rpc SaveFavoriteMessage(Message) returns (AddFavoriteResponse);
  rpc GetDevices(GetDevicesRequest) returns (GetDevicesResponse);
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc DeleteOtherDevices(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  // ChatList v2
  rpc PinChat(PinChatRequest) returns (PinChatResponse);
  rpc UnPinChat(UnPinChatRequest) returns (UnPinChatResponse);
  rpc SearchChats(SearchChatsRequest) returns (SearchChatsResponse);
  rpc ArchiveChat(ArchiveChatRequest) returns (ArchiveChatResponse);
  rpc UnarchiveChat(UnarchiveChatRequest) returns (UnarchiveChatResponse);

  // Pin Message
  rpc PinMessage(PinMessageRequest) returns (PinMessageResponse);
  rpc UnPinMessage(UnPinMessageRequest) returns (UnPinMessageResponse);
  rpc GetPinnedMessages(GetPinnedMessagesRequest) returns (GetPinnedMessagesResponse);

  // Secret Chats (E2EE)
  rpc CreateSecretChat(CreateSecretChatRequest) returns (CreateSecretChatResponse);
  rpc ExchangeSecretKey(ExchangeSecretKeyRequest) returns (ExchangeSecretKeyResponse);
  rpc GetSecretChatKey(GetSecretChatKeyRequest) returns (GetSecretChatKeyResponse);

  // OWL AI Assistant (deprecated — use ChatWithAI with session_id)
  rpc ChatWithOWL(OWLRequest) returns (stream OWLResponse);
  rpc CreateOwlChat(CreateOwlChatRequest) returns (CreateOwlChatResponse);
  rpc DeleteOwlChat(DeleteOwlChatRequest) returns (DeleteOwlChatResponse);
  rpc GetOwlHistory(GetOwlHistoryRequest) returns (GetOwlHistoryResponse);
  rpc UpdateOwlSettings(UpdateOwlSettingsRequest) returns (UpdateOwlSettingsResponse);
  rpc GetOwlSettings(GetOwlSettingsRequest) returns (GetOwlSettingsResponse);

  // Hermes Multi-Agent Orchestrator (deprecated — use ChatWithAI with session_id)
  rpc ChatWithOrchestrator(OrchestratorRequest) returns (stream OrchestratorResponse);
  rpc GetOrchestratorHistory(GetOrchestratorHistoryRequest) returns (GetOrchestratorHistoryResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListAgentPresets(ListAgentPresetsRequest) returns (ListAgentPresetsResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  rpc ListUserAgents(ListUserAgentsRequest) returns (ListUserAgentsResponse);
  rpc CreateHermesSession(CreateHermesSessionRequest) returns (CreateHermesSessionResponse);
  rpc DeleteHermesSession(DeleteHermesSessionRequest) returns (DeleteHermesSessionResponse);
  rpc ListRemoteAgents(ListRemoteAgentsRequest) returns (ListRemoteAgentsResponse);
  rpc DeployAgentTask(DeployAgentTaskRequest) returns (DeployAgentTaskResponse);
  rpc DeployAgentTaskStream(DeployAgentTaskRequest) returns (stream DeployAgentTaskStreamResponse);
  rpc GetRemoteAgentStatus(GetRemoteAgentStatusRequest) returns (GetRemoteAgentStatusResponse);

  // AI Chat (unified for OWL + Hermes)
  rpc ChatWithAI(AIChatRequest) returns (stream AIChatResponse);
  rpc GetAIChatHistory(GetAIChatHistoryRequest) returns (GetAIChatHistoryResponse);
  rpc GetAIChatSettings(GetAIChatSettingsRequest) returns (AIChatSettings);
  rpc UpdateAIChatSettings(UpdateAIChatSettingsRequest) returns (UpdateAIChatSettingsResponse);

  // AI Chats management (unified list for OWL + Hermes)
  rpc GetAIChats(GetAIChatsRequest) returns (GetAIChatsResponse);
  rpc RenameAIChat(RenameAIChatRequest) returns (RenameAIChatResponse);

  // Hermes AI Pipeline (RAG + LLM + Tool Calling)
  rpc ChatWithPipeline(PipelineRequest) returns (stream PipelineResponse);

  // Hermes Chat Settings
  rpc GetHermesSettings(GetHermesSettingsRequest) returns (GetHermesSettingsResponse);
  rpc UpdateHermesSettings(UpdateHermesSettingsRequest) returns (UpdateHermesSettingsResponse);

  // Bot Commands
  rpc ProcessBotCommand(BotCommandRequest) returns (BotCommandResponse);
  rpc GetBotCommands(GetBotCommandsRequest) returns (GetBotCommandsResponse);
  rpc GetOWLStatus(OWLStatusRequest) returns (OWLStatusResponse);

  // Server Notifications
  rpc SubscribeNotifications(SubscribeNotificationsRequest) returns (stream ServerNotification);
  rpc GetNotificationHistory(GetNotificationHistoryRequest) returns (GetNotificationHistoryResponse);
  rpc MarkNotificationsRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);

  // Free OpenRouter Models (admin-managed list for free tier)
  rpc GetFreeModels(GetFreeModelsRequest) returns (GetFreeModelsResponse);
  rpc SetFreeModel(SetFreeModelRequest) returns (SetFreeModelResponse);
  rpc RemoveFreeModel(RemoveFreeModelRequest) returns (RemoveFreeModelResponse);

  // === Chat v2 (bidirectional stream) ===
  rpc ChatV2(stream ChatV2Message) returns (stream ChatV2Message);

  // === Messages v2 ===
  rpc GetHistoryV2(GetHistoryV2Request) returns (GetHistoryV2Response);
  rpc SendMessageV2(SendMessageV2Request) returns (SendMessageV2Response);
  rpc EditMessageV2(EditMessageV2Request) returns (EditMessageV2Response);
  rpc DeleteMessageV2(DeleteMessageV2Request) returns (DeleteMessageV2Response);
  rpc SetReactionV2(SetReactionV2Request) returns (SetReactionV2Response);

  // === Message Search ===
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);

  // === AI Services v2 ===
  rpc ChatWithAIV2(ChatWithAIV2Request) returns (stream ChatWithAIV2Response);
  rpc CreateAIAgent(CreateAIAgentRequest) returns (CreateAIAgentResponse);
  rpc UpdateAIAgent(UpdateAIAgentRequest) returns (UpdateAIAgentResponse);
  rpc DeleteAIAgent(DeleteAIAgentRequest) returns (DeleteAIAgentResponse);
  rpc GetAIAgent(GetAIAgentRequest) returns (GetAIAgentResponse);
  rpc ListAIAgents(ListAIAgentsRequest) returns (ListAIAgentsResponse);
  rpc CloneAIAgent(CloneAIAgentRequest) returns (CloneAIAgentResponse);
  rpc ListAITools(ListAIToolsRequest) returns (ListAIToolsResponse);
  // === AI Marketplace ===
  rpc RateAIAgent(RateAIAgentRequest) returns (RateAIAgentResponse);
  rpc GetAIAgentReviews(GetAIAgentReviewsRequest) returns (GetAIAgentReviewsResponse);
  rpc ListMarketplaceAgents(ListMarketplaceAgentsRequest) returns (ListMarketplaceAgentsResponse);
  rpc GetAIAgentStats(GetAIAgentStatsRequest) returns (GetAIAgentStatsResponse);
  rpc ShareAIAgent(ShareAIAgentRequest) returns (ShareAIAgentResponse);
  rpc InstallAIAgent(InstallAIAgentRequest) returns (InstallAIAgentResponse);
  rpc GetAIUsageStats(GetAIUsageStatsRequest) returns (GetAIUsageStatsResponse);
  // === AI Chat v2 ===
  rpc GetAIV2ChatHistory(GetAIV2ChatHistoryRequest) returns (GetAIV2ChatHistoryResponse);
  rpc ListAIV2Chats(ListAIV2ChatsRequest) returns (ListAIV2ChatsResponse);

  // === Admin User List ===
  rpc GetAdminUserList(GetAdminUserListRequest) returns (GetAdminUserListResponse);
  rpc GetAdminUserSessions(GetAdminUserSessionsRequest) returns (GetAdminUserSessionsResponse);
}

// ======= AI Pipeline Messages =======

message PipelineRequest {
  string user_id = 1;
  string session_id = 2;
  string message = 3;
  repeated bytes images = 4; // Raw image bytes for multimodal RAG
  string model_hint = 5;     // "openrouter/auto", "local/hermes", etc.
}

message PipelineResponse {
  string token = 1;
  bool finished = 2;
  string error = 3;
  bool has_rag_context = 4;  // Indicates if RAG context was used
}

// ======= ChatList v2 Messages =======

message PinChatRequest {
  string user_id = 1;
  string chat_id = 2;
}

message PinChatResponse {
  bool success = 1;
}

message UnPinChatRequest {
  string user_id = 1;
  string chat_id = 2;
}

message UnPinChatResponse {
  bool success = 1;
}

message SearchChatsRequest {
  string user_id = 1;
  string query = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message SearchChatsResponse {
