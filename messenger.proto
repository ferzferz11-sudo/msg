  string message_id = 2;
}

message AddFavoriteResponse {
  bool success = 1;
  string message = 2;
}

message RemoveFavoriteRequest {
  string user_id = 1;
  string message_id = 2;
}

message RemoveFavoriteResponse {
  bool success = 1;
}

message GetFavoritesRequest {
  string user_id = 1;
}

message GetFavoritesResponse {
  repeated Message messages = 1;
}

message TypingRequest {
  string room_id = 1;
  string username = 2;
  bool is_typing = 3;
  string user_id = 4;
}

message TypingSignal {
  string room_id = 1;
  string username = 2;
  bool is_typing = 3;
}

message DeviceInfo {
  string device_id = 1;
  string device_name = 2;
  string client_version = 3;
